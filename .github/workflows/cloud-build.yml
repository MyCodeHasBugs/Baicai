name: cloud-build

# 由手机端 App 触发：上传工程分片 → 这里合并解压 → Gradle 编译 → 发布 APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '输入 release tag（App 上传的分片所在 tag）'
        required: true
      apk_tag:
        description: '产物 release tag'
        required: true
      variant:
        description: 'debug 或 release'
        required: false
        default: 'debug'

permissions:
  contents: write

concurrency:
  group: cloud-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: 云端构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出构建脚本
        uses: actions/checkout@v4

      - name: 下载工程分片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in
          gh release download "$TAG" --dir /tmp/in --pattern 'project.zip.part*' --repo "$GITHUB_REPOSITORY"
          cat /tmp/in/project.zip.part* > /tmp/in/project.zip
          ls -lh /tmp/in/project.zip
          echo "分片数: $(ls /tmp/in/project.zip.part* | wc -l)"

      - name: 解压工程
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          cd /tmp/src
          unzip -q /tmp/in/project.zip
          echo "---- 顶层内容 ----"
          ls -la | head -40
          python3 "$GITHUB_WORKSPACE/toolkit/normalize_project.py" "$(pwd)" || true
          GRADLEW=$(find . -maxdepth 8 -name gradlew -type f | head -1 || true)
          SETTINGS=$(find . -maxdepth 8 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -type f | head -1 || true)
          MANIFEST=$(find . -maxdepth 8 -name AndroidManifest.xml -type f -not -path '*/build/*' | head -1 || true)
          echo "gradlew: ${GRADLEW:-未找到}"
          echo "settings: ${SETTINGS:-未找到}"
          echo "AndroidManifest: ${MANIFEST:-未找到}"
          if [ -n "$GRADLEW" ]; then
            ROOT=$(dirname "$GRADLEW")
            echo "MODE=gradle" >> "$GITHUB_ENV"
            echo "GRADLE_ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
            echo "使用 gradlew 构建: $(realpath "$ROOT")"
            DIST_PROP=$(find "$(realpath "$ROOT")" -maxdepth 4 -name gradle-wrapper.properties -type f | head -1 || true)
            [ -n "$DIST_PROP" ] && echo "DIST_KEY=$(sha1sum "$DIST_PROP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
            GRADLE_VER=""
            if [ -n "$DIST_PROP" ]; then
              GURL=$(sed -n 's/^distributionUrl=//p' "$DIST_PROP" | sed 's/\\:/:/g')
              GRADLE_VER=$(echo "$GURL" | sed -n 's/.*gradle-\([0-9][0-9]*\)\..*/\1/p')
            fi
            if [ -n "$GRADLE_VER" ] && [ "$GRADLE_VER" -lt 7 ] 2>/dev/null; then
              echo "OLD_GRADLE=1" >> "$GITHUB_ENV"
              echo "检测到老 Gradle $GRADLE_VER，将使用 JDK 11"
            fi
            DEPS_KEY=$(find "$(realpath "$ROOT")" -maxdepth 3 \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -type f -exec sha1sum {} \; | sort | sha1sum | cut -d' ' -f1)
            echo "DEPS_KEY=$DEPS_KEY" >> "$GITHUB_ENV"
          elif [ -n "$SETTINGS" ]; then
            ROOT=$(dirname "$SETTINGS")
            echo "MODE=gradle" >> "$GITHUB_ENV"
            echo "GRADLE_ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
            echo "没有 gradlew，但有 settings.gradle，使用云端 Gradle 构建: $(realpath "$ROOT")"
            DIST_PROP=$(find "$(realpath "$ROOT")" -maxdepth 4 -name gradle-wrapper.properties -type f | head -1 || true)
            [ -n "$DIST_PROP" ] && echo "DIST_KEY=$(sha1sum "$DIST_PROP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
            GRADLE_VER=""
            if [ -n "$DIST_PROP" ]; then
              GURL=$(sed -n 's/^distributionUrl=//p' "$DIST_PROP" | sed 's/\\:/:/g')
              GRADLE_VER=$(echo "$GURL" | sed -n 's/.*gradle-\([0-9][0-9]*\)\..*/\1/p')
            fi
            if [ -n "$GRADLE_VER" ] && [ "$GRADLE_VER" -lt 7 ] 2>/dev/null; then
              echo "OLD_GRADLE=1" >> "$GITHUB_ENV"
              echo "检测到老 Gradle $GRADLE_VER，将使用 JDK 11"
            fi
            DEPS_KEY=$(find "$(realpath "$ROOT")" -maxdepth 3 \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -type f -exec sha1sum {} \; | sort | sha1sum | cut -d' ' -f1)
            echo "DEPS_KEY=$DEPS_KEY" >> "$GITHUB_ENV"
          else
            if python3 "$GITHUB_WORKSPACE/toolkit/wrap_gradle.py" "$(pwd)"; then
              echo "MODE=gradle" >> "$GITHUB_ENV"
              echo "GRADLE_ROOT=$(pwd)" >> "$GITHUB_ENV"
              DIST_PROP="$(pwd)/gradle/wrapper/gradle-wrapper.properties"
              [ -f "$DIST_PROP" ] && echo "DIST_KEY=$(sha1sum "$DIST_PROP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
              echo "检测到 Kotlin/AppCompat 源码，已自动包装成 Gradle 工程"
            else
              echo "MODE=bare" >> "$GITHUB_ENV"
              echo "没有 Gradle 工程，改走裸源码编译（aapt2 + javac + d8 + clang）"
              if [ -z "$MANIFEST" ]; then
                echo "::warning::没找到 AndroidManifest.xml，裸源码编译大概率失败"
              fi
            fi
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 JDK 11（兼容老 Gradle）
        if: env.MODE == 'gradle' && env.OLD_GRADLE == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 配置 Gradle 缓存
        if: env.MODE == 'gradle' && env.OLD_GRADLE != '1'
        uses: gradle/actions/setup-gradle@v3

      - name: 定位 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::runner 上没有 Android SDK（ANDROID_HOME=$SDK）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"

      - name: 安装 compileSdk
        if: env.MODE == 'gradle'
        run: |
          set -euo pipefail
          if [ -f /tmp/compile_sdk.txt ]; then
            CS=$(cat /tmp/compile_sdk.txt)
            if [ ! -d "$ANDROID_HOME/platforms/android-$CS" ]; then
              SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1 || true)
              if [ -n "$SDKMGR" ]; then
                yes | "$SDKMGR" "platforms;android-$CS" >/dev/null 2>&1 || true
                echo "installed platform android-$CS"
              fi
            fi
          fi
      - name: 缓存 Gradle 发行版
        if: env.MODE == 'gradle' && env.DIST_KEY != ''
        uses: actions/cache@v4
        with:
          path: /home/runner/gradle-dist
          key: gradle-dist-${{ env.DIST_KEY }}

      - name: 缓存 Gradle 依赖
        if: env.MODE == 'gradle' && env.DEPS_KEY != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-${{ env.DEPS_KEY }}
          restore-keys: |
            gradle-deps-

      - name: 处理缺失的 CMake 配置
        if: env.MODE == 'gradle'
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          if grep -rqs 'externalNativeBuild' app/build.gradle app/build.gradle.kts 2>/dev/null; then
            if python3 "$GITHUB_WORKSPACE/toolkit/ensure_cmake.py" "$GRADLE_ROOT"; then
              echo "CMake 配置就绪，保留 native 构建"
            else
              echo "::warning::没有 CMakeLists.txt 也没有 cpp 源码；临时禁用 externalNativeBuild 以便出包"
              python3 "$GITHUB_WORKSPACE/toolkit/strip_external_native.py" \
                app/build.gradle app/build.gradle.kts || true
            fi
          fi

      - name: 补全基础资源
        if: env.MODE == 'gradle'
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          python3 "$GITHUB_WORKSPACE/toolkit/ensure_app_name.py" "$GRADLE_ROOT" || true
          MAN=""
          [ -f app/src/main/AndroidManifest.xml ] && MAN="app/src/main/AndroidManifest.xml"
          if [ -z "$MAN" ] && [ -f src/main/AndroidManifest.xml ]; then MAN="src/main/AndroidManifest.xml"; fi
          if [ -n "$MAN" ]; then
            python3 "$GITHUB_WORKSPACE/toolkit/sanitize_manifest.py" "$MAN" "$(dirname "$MAN")/res" --keep-theme || true
            python3 "$GITHUB_WORKSPACE/toolkit/ensure_android_res.py" "$(dirname "$MAN")" || true
          fi

      - name: 补全 Gradle 配置
        if: env.MODE == 'gradle'
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^org.gradle.jvmargs=' gradle.properties || echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties
          grep -q '^org.gradle.parallel=' gradle.properties || echo 'org.gradle.parallel=true' >> gradle.properties
          grep -q '^org.gradle.caching=' gradle.properties || echo 'org.gradle.caching=true' >> gradle.properties

      - name: Gradle 编译
        if: env.MODE == 'gradle'
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          cd "$GRADLE_ROOT"
          if [ "${OLD_GRADLE:-0}" = "1" ]; then
            export JAVA_HOME="${JAVA_HOME_11_X64:-$JAVA_HOME}"
            echo "老 Gradle，使用 JDK 11: $JAVA_HOME"
          else
            export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          fi
          if [ "$VARIANT" = "release" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          # 多模块工程优先用 normalize 解析到的 application 模块
          if [ -f /tmp/app_module.txt ]; then
            MOD=$(cat /tmp/app_module.txt)
            if [ -n "$MOD" ]; then
              TASK="$MOD:$TASK"
              echo "使用 application 模块 $MOD"
            fi
          elif grep -qE "include.*['\"]:app['\"]" settings.gradle settings.gradle.kts 2>/dev/null; then
            TASK=":app:$TASK"
            echo "检测到 :app 模块，只构建 $TASK"
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "执行 ./gradlew $TASK"
            ./gradlew "$TASK" --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          else
            # 工程没带 gradlew：优先用缓存，没有再按 gradle-wrapper.properties 下载
            GBIN=$(find /home/runner/gradle-dist -type f -name gradle 2>/dev/null | head -1 || true)
            if [ -z "$GBIN" ]; then
              PROP=gradle/wrapper/gradle-wrapper.properties
              if [ -f "$PROP" ]; then
                URL=$(sed -n 's/^distributionUrl=//p' "$PROP" | sed 's/\\:/:/g')
                echo "下载工程指定的 Gradle: $URL"
                mkdir -p /home/runner/gradle-dist
                curl -fsSL "$URL" -o /tmp/gradle.zip
                unzip -q /tmp/gradle.zip -d /home/runner/gradle-dist
                GBIN=$(find /home/runner/gradle-dist -type f -name gradle | head -1)
              else
                GBIN=$(command -v gradle || true)
              fi
            else
              echo "使用缓存的 Gradle: $GBIN"
            fi
            [ -n "$GBIN" ] || { echo "::error::找不到 Gradle，无法构建"; exit 1; }
            chmod +x "$GBIN" 2>/dev/null || true
            echo "执行 $GBIN $TASK"
            "$GBIN" "$TASK" --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          fi

      - name: 裸源码编译（无 Gradle）
        if: env.MODE == 'bare'
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/toolkit/build-bare.sh"
          bash "$GITHUB_WORKSPACE/toolkit/build-bare.sh" /tmp/src /tmp/out 2>&1 | tee /tmp/build.log

      - name: 收集 APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          if [ "$MODE" = "bare" ]; then
            APK=/tmp/out/app-bare.apk
          else
            cd "$GRADLE_ROOT"
            APK=$(find . -path '*/build/outputs/apk/*/*.apk' -type f | head -1 || true)
          fi
          if [ -z "${APK:-}" ]; then
            echo "::error::没有找到 APK 产物"
            find /tmp -name '*.apk' | head -20
            exit 1
          fi
          # 未签名的 release 包装不上，这里用一次性 debug keystore 补签，保证产物可安装
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APKSIGNER="$BT/apksigner"
          ZIPALIGN="$BT/zipalign"
          if [ -x "$APKSIGNER" ] && ! "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "APK 未签名，使用 debug keystore 补签"
            KS=/tmp/debug.keystore
            keytool -genkeypair -keystore "$KS" -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            "$ZIPALIGN" -f -p 4 "$APK" /tmp/aligned.apk
            "$APKSIGNER" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true \
              --out /tmp/signed.apk /tmp/aligned.apk
            APK=/tmp/signed.apk
          fi
          cp "$APK" "/tmp/out/app-${{ inputs.variant }}.apk"
          ls -lh /tmp/out/
          sha256sum "/tmp/out/app-${{ inputs.variant }}.apk" | tee /tmp/out/apk-sha256.txt

      - name: 发布 APK 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_TAG: ${{ inputs.apk_tag }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          gh release create "$APK_TAG" \
            "/tmp/out/app-$VARIANT.apk" \
            "/tmp/out/apk-sha256.txt" \
            --title "APK $APK_TAG" \
            --notes "由 cloud-build workflow 自动产出。variant=$VARIANT，run=$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY"

      - name: 上传工作流产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: /tmp/out
          if-no-files-found: warn
          retention-days: 14

      - name: 回传编译错误
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERR_TAG: err-${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -f /tmp/build.log ]; then
            {
              grep -E 'e: file|error:|FAILURE|What went wrong|Unresolved|Could not|> Task .*FAILED|Caused by|No such|not found' /tmp/build.log | head -60 || true
              echo '---- tail ----'
              tail -n 15 /tmp/build.log
            } | sed -E 's#/tmp/src/##g; s#https://github.com/[^ ]+##g' > /tmp/error.txt
            gh release create "$ERR_TAG" --title "编译错误" --notes-file /tmp/error.txt \
              --repo "$GITHUB_REPOSITORY" \
              || gh release edit "$ERR_TAG" --notes-file /tmp/error.txt \
                   --repo "$GITHUB_REPOSITORY" || true
          fi
      - name: 清理输入 release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true